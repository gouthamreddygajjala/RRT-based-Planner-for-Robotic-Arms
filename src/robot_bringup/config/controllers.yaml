controller_manager:
  ros__parameters:
    update_rate: 500  # 1000 is overkill unless needed

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


arm_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 100.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: true
    open_loop_control: false
    allow_integration_in_goal_trajectories: false

    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0

    gains:
      panda_joint1: {p: 100.0}
      panda_joint2: {p: 100.0}
      panda_joint3: {p: 100.0}
      panda_joint4: {p: 80.0}
      panda_joint5: {p: 60.0}
      panda_joint6: {p: 50.0}
      panda_joint7: {p: 30.0}

