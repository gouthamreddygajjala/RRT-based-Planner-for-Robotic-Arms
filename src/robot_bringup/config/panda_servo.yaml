moveit_servo:
  ros__parameters:
    use_gazebo: true
    
    move_group_name: panda_arm
    
    command_in_type: unitless
    command_out_type: trajectory_msgs/JointTrajectory
    
    command_out_topic: /arm_controller/joint_trajectory
    joint_command_in_topic: ~/delta_joint_cmds
    cartesian_command_in_topic: ~/delta_twist_cmds
    
    # Optimized for Gazebo simulation
    publish_period: 0.05  # 20Hz - better for simulation
    publish_joint_positions: true
    publish_joint_velocities: true
    publish_joint_accelerations: false
    
    robot_link_command_frame: panda_link0
    planning_frame: panda_link0
    ee_frame_name: panda_link8
    
    scale:
      linear: 0.4
      rotational: 0.8
      joint: 0.5
    
    low_pass_filter_coeff: 1.5  # Reduced for performance
    
    incoming_command_timeout: 0.5
    
    # Disabled for performance
    check_collisions: false
    collision_check_rate: 5.0  # Reduced from 10.0
    self_collision_proximity_threshold: 0.01
    scene_collision_proximity_threshold: 0.02
    
    lower_singularity_threshold: 17.0
    hard_stop_singularity_threshold: 30.0
    
    override_velocity_scaling_factor: 0.0